<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechZone | Next-Gen Gadgets</title>
    <!-- Link to CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Navigation -->
    <nav>
        <div class="logo">TECHZONE</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search gadgets (e.g. Samsung, Apple, ROG)..." onkeyup="filterProducts()">
        </div>
    </nav>

    <!-- Hero Promotional Banner -->
    <div class="hero">
        <div>
            <span class="hero-badge">Special Offer</span>
            <h1 style="margin: 0.5rem 0;">Cyber Week Mega Sale</h1>
            <p style="color: var(--text-muted);">Get up to 30% off on flagship smartphones & smartwatches</p>
        </div>
    </div>

    <!-- Category Filter Tabs -->
    <div class="categories">
        <button class="cat-btn active" onclick="selectCategory('All', this)">All Products</button>
        <button class="cat-btn" onclick="selectCategory('Smartphones', this)">Smartphones</button>
        <button class="cat-btn" onclick="selectCategory('Smartwatches / Wearables', this)">Smartwatches</button>
        <button class="cat-btn" onclick="selectCategory('Laptops', this)">Laptops</button>
        <button class="cat-btn" onclick="selectCategory('Audio & Headphones', this)">Audio</button>
        <button class="cat-btn" onclick="selectCategory('Gaming Accessories', this)">Gaming</button>
    </div>

    <!-- Product Grid (Populated dynamically via script.js) -->
    <div class="product-grid" id="productGrid"></div>

    <!-- Express Checkout Modal with Credit Card Inputs -->
    <div class="modal" id="checkoutModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 style="margin-bottom: 0.5rem; color: var(--neon-cyan);">Express Checkout</h2>
            <p id="checkoutProduct" style="margin-bottom: 1.2rem; color: var(--text-muted); font-size: 0.9rem;"></p>
            
            <form onsubmit="handlePayment(event)">
                <div class="form-group">
                    <label>Cardholder Name</label>
                    <input type="text" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Card Number</label>
                    <input type="text" required placeholder="4532 •••• •••• 8892" maxlength="19">
                </div>
                <div style="display: flex; gap: 1rem;">
                    <div class="form-group" style="flex:1;">
                        <label>Expiry</label>
                        <input type="text" required placeholder="MM/YY">
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label>CVV</label>
                        <input type="password" required placeholder="•••" maxlength="4">
                    </div>
                </div>
                <button type="submit" class="btn-buy" style="width: 100%; margin-top: 1rem; padding: 0.8rem;">Pay & Confirm Order</button>
            </form>
        </div>
    </div>

    <!-- Link to JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
